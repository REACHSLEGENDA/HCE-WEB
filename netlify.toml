[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# El service worker nunca debe quedarse pegado en el cache HTTP: si el
# navegador sirviera una copia vieja de /sw.js, el portal se quedaria con una
# version antigua del cache. Lo mismo para el manifest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# El redirect SPA va al final: solo actua cuando NO existe un archivo estatico
# con esa ruta, por lo que /sw.js, /manifest.json y /icons/* se sirven tal cual.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
