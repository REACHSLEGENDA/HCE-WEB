[build]
  command = "npm run verificar"
  publish = "dist"
  functions = "netlify/functions"

# El service worker nunca debe quedarse pegado en el cache HTTP: si el
# navegador sirviera una copia vieja de /sw.js, el portal se quedaria con una
# version antigua del cache. Lo mismo para el manifest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# ---------------------------------------------------------------------------
# Direcciones viejas (sitio anterior en WordPress): redirección permanente 301
# a su página actual, para no perder enlaces ni posicionamiento.
[[redirects]]
  from = "/ecmosim"
  to = "/simulador-ecmo-sim"
  status = 301
  force = true

[[redirects]]
  from = "/ecmosim/*"
  to = "/simulador-ecmo-sim"
  status = 301
  force = true

[[redirects]]
  from = "/shop"
