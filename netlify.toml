# Insuficiencia cardiaca: el diplomado no está publicado (se retiró el 25 ago
# 2026). Mientras tanto, redirección temporal 302 a los programas.
[[redirects]]
  from = "/insuficiencia-cardiaca"
  to = "/programas"
  status = 302
  force = true

[[redirects]]
  from = "/insuficiencia-cardiaca/*"
  to = "/programas"
  status = 302
  force = true

